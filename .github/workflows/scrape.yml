name: Daily job-posting scrape

on:
  schedule:
    # 13:17 UTC (~6am Pacific) -- offset from the hour to avoid GitHub's on-the-hour
    # load spike, where cron runs get delayed or silently dropped
    - cron: "17 13 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.run

      - name: Find reposts
        run: python -m scraper.find_reposts

      - name: Commit new data
        run: |
          git config user.name "ghost-job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily scrape: $(date -u +%Y-%m-%d)"
            git push
          fi
